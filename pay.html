<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png"><link rel="icon" type="image/png" sizes="192x192" href="assets/icons/favicon-192.png"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Checkout (simulated Bókun)</title>
<script src="js/focus-guard.js"></script>
<link rel="stylesheet" href="styles/app.css">
<style>
  /* Deliberately NOT the Kólumbus look: this stands in for Bókun's own hosted checkout page. */
  body { background: #f4f5f7; color: #1d2430; color-scheme: light; }
  .mock { background: #fff3c4; color: #4a3b00; font-size: 13px; text-align: center; padding: 8px 16px; }
  .box { max-width: 520px; margin: 32px auto; background: #fff; border: 1px solid #d9dde3; border-radius: 8px; padding: 24px; display: grid; gap: 18px; }
  .box h1 { font-size: 22px; letter-spacing: -.01em; }
  .box .row2 { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
  .box .row2 span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .box .tot { border-top: 1px solid #d9dde3; padding-top: 12px; font-weight: 600; font-size: 18px; }
  .box label { font-size: 13px; color: #4a5361; }
  .box input { height: 46px; border: 1px solid #767676; border-radius: 6px; padding: 0 12px; background: #fff; color: #1d2430; width: 100%; font-size: 16px; }
  .b { min-height: 48px; border-radius: 6px; border: 1px solid #1d2430; background: #fff; color: #1d2430; font-weight: 500; cursor: pointer; font-size: 16px; }
  .b.main { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  .muted { color: #4a5361; font-size: 13px; }
  :focus-visible { outline: 2px solid #1f6feb; outline-offset: 2px; }
</style>
</head>
<body>
<div class="mock" role="note">Simulated Bókun checkout for the prototype. No card details are asked for and nothing is charged.</div>
<main class="box" id="main"></main>
<script type="module" src="js/guest-pay.js"></script>
</body>
</html>
