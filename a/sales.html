<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" type="image/png" sizes="48x48" href="../assets/icons/favicon-48.png"><link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/favicon-192.png"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Sales · Sölunet</title>
<script src="../js/focus-guard.js"></script>
<link rel="stylesheet" href="../styles/app.css">
<style>
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 8px; }
  .pill { min-height: 44px; padding: 0 14px; border: 1px solid var(--w12); border-radius: 20px; background: none; cursor: pointer; font-size: 14px; color: var(--w70); }
  .pill[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-text); }
  .desk { display: none; } @media (min-width: 1280px) { .desk { display: table; } .phone { display: none; } }
  .totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; border-top: var(--hair); padding-top: 16px; margin-top: 8px; }
  @media (min-width: 768px) { .totals { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .totals dt { font-size: 13px; color: var(--w70); } .totals dd { margin: 2px 0 0; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<main class="wrap" id="main">
  <p class="eyebrow">Sales</p>
  <h1 class="h-page" style="margin:10px 0 8px">Your sales</h1>
  <p class="dim">Every booking made through your links, code or quotes. Tap one to see exactly how your commission was worked out.</p>
  <dl class="totals" id="totals"></dl>
  <div class="pills" role="group" aria-label="Filter sales" id="pills"></div>
  <div id="list"></div>
</main>
<script type="module">
import * as store from '../js/store.js'
import { $, esc, isk, agentShell, dayLabel, monthLabel, statusTag } from '../js/ui.js'
agentShell('sales', 'Sales')
const F = [['all', 'All'], ['confirmed', 'Confirmed'], ['pending', 'Waiting'], ['cancelled', 'Cancelled']]
let f = new URLSearchParams(location.search).get('f') || 'all'
const fresh = sessionStorage.getItem('fresh-order')
function draw() {
  const all = store.salesFor(store.me().id)
  const match = o => f === 'all' || (f === 'confirmed' ? ['confirmed', 'partially_refunded'].includes(o.state) : f === 'pending' ? ['handed_off', 'requested'].includes(o.state) : ['cancelled', 'failed'].includes(o.state))
  const rows = all.filter(match)
  const conf = all.filter(o => ['confirmed', 'partially_refunded'].includes(o.state))
  $('#totals').innerHTML = [['Confirmed bookings', conf.length], ['Guests', conf.reduce((s, o) => s + o.pax, 0)],
    ['Customers paid, net of refunds', isk(conf.reduce((s, o) => s + o.payments.reduce((t, p) => t + (p.kind === 'capture' ? p.amount : -p.amount), 0), 0))], ['Your commission', isk(all.reduce((s, o) => s + store.balanceOf(o.id), 0))]]
    .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')
  $('#pills').innerHTML = F.map(([k, l]) => `<button class="pill" data-f="${k}" aria-pressed="${k === f}">${l}</button>`).join('')
  document.querySelectorAll('.pill').forEach(b => b.onclick = () => { f = b.dataset.f; history.replaceState(null, '', `?f=${f}`); draw() })
  if (!rows.length) { $('#list').innerHTML = `<p class="notice" style="margin-top:24px">${all.length ? 'No sales match this filter.' : 'No sales yet. Share a tour from Sell to make your first one.'}</p>`; return }
  const byMonth = {}
  rows.forEach(o => (byMonth[o.date.slice(0, 7)] ||= []).push(o))
  $('#list').innerHTML = Object.entries(byMonth).map(([m, os]) => `
    <div class="month"><h2>${esc(monthLabel(m + '-01'))} departures</h2><span class="meta">${os.length} ${os.length === 1 ? 'booking' : 'bookings'}</span></div>
    <ul class="rows phone">${os.map(o => { const t = store.tour(o.tourId); return `<li><a class="row${o.id === fresh ? ' fresh' : ''}" href="sale.html?id=${o.id}">
      <span class="r1">${esc(t.title)}</span><span class="r2">${esc(dayLabel(o.date))} · ${esc(o.time)} Iceland · ${o.pax} guests · ${statusTag(o.state)}</span>
      <span class="r3"><span class="dim">Your commission</span><span class="money">${isk(store.balanceOf(o.id))}</span></span></a></li>` }).join('')}</ul>
    <table class="ledger desk"><thead><tr><th>Departure</th><th>Tour</th><th class="num">Guests</th><th>Status</th><th class="num">Customer paid, net</th><th class="num">Your commission</th></tr></thead>
    <tbody>${os.map(o => { const t = store.tour(o.tourId); return `<tr class="link${o.id === fresh ? ' fresh' : ''}" data-href="sale.html?id=${o.id}">
      <td class="when">${esc(dayLabel(o.date))}<div class="sub">${esc(o.time)} Iceland</div></td>
      <td><a class="tour" href="sale.html?id=${o.id}" style="text-decoration:none">${esc(t.title)}</a><div class="sub">${esc(o.ref || 'No booking yet')}</div></td>
      <td class="num">${o.pax}</td><td>${statusTag(o.state)}</td>
      <td class="num money">${['confirmed', 'partially_refunded'].includes(o.state) ? isk(o.payments.reduce((t, p) => t + (p.kind === 'capture' ? p.amount : -p.amount), 0)) : '<span class="dim">—</span>'}</td>
      <td class="num money">${isk(store.balanceOf(o.id))}</td></tr>` }).join('')}</tbody></table>`).join('')
  document.querySelectorAll('tr.link').forEach(tr => tr.onclick = e => { if (e.target.closest('a')) return; location.href = tr.dataset.href })
  sessionStorage.removeItem('fresh-order')
}
draw()
window.addEventListener('storage', () => { store.refresh(); draw() })
</script>
</body>
</html>
